name: Kittygram CI

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: kittygram
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kittygram_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_DB: kittygram
      POSTGRES_USER: kittygram_user
      POSTGRES_PASSWORD: kittygram_password
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check backend

      - name: Run backend tests
        run: |
          cd backend
          python manage.py test

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --watchAll=false

  build-and-push:
    runs-on: ubuntu-latest
    needs: [tests, frontend-tests]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/kittygram_backend ./backend

      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/kittygram_frontend ./frontend

      - name: Build gateway image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/kittygram_gateway ./nginx

      - name: Push images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/kittygram_backend
          docker push ${{ secrets.DOCKER_USERNAME }}/kittygram_frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/kittygram_gateway

  telegram-notify:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()

    steps:
      - name: Send Telegram message
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "Kittygram CI/CD успешно завершён"